name: Progression Windows validation
on:
  push:
    branches: [feat/poe1-progression]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: progression-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Read upstream pins
        id: pins
        shell: bash
        run: |
          pin() { awk -v s="[$1]" '$0 == s {f=1; next} /^\[/ {f=0} f && /^commit/' pob-sync.toml | cut -d'"' -f2; }
          echo "poe1=$(pin poe1)" >> "$GITHUB_OUTPUT"
          echo "poe2=$(pin poe2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: ${{ steps.pins.outputs.poe1 }}
          path: upstream/PathOfBuilding
      - uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: ${{ steps.pins.outputs.poe2 }}
          path: upstream/PathOfBuilding-PoE2
      - name: Set native compiler environment
        shell: pwsh
        run: |
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          Remove-Item Env:NoDefaultCurrentDirectoryInExePath -ErrorAction SilentlyContinue
          "NoDefaultCurrentDirectoryInExePath=" >> $env:GITHUB_ENV
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test scripts
      - run: bun run build
      - name: Sync pinned PoB engines
        run: |
          cargo run -p pob-sync -- --source upstream/PathOfBuilding-PoE2
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo run -p pob-sync -- --game poe1 --source upstream/PathOfBuilding
      - name: Rust regression tests
        run: |
          cargo test -p pob-engine
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test -p pob-redux --lib
      - name: Validate Progression against real PoB
        env:
          POB_REDUX_POB_ROOT: src-tauri/resources/pob1
        run: cargo test -p pob-engine --test progression -- --ignored --nocapture
      - name: Build isolated unsigned Windows installer
        env:
          VITE_PROGRESSION_VALIDATION: "true"
        run: bun run tauri build --bundles nsis --config src-tauri/tauri.progression.conf.json
      - uses: actions/upload-artifact@v7
        with:
          name: progression-windows-${{ github.sha }}
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
