name: check

# Fast validation for ordinary commits. Installers are built and published only
# by release.yml, on a tag.
#
# Runs on Windows, the only platform this fork ships.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  POB_FORGE_CDN_URL: ${{ vars.POB_FORGE_CDN_URL }}
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # Secrets cannot appear in `if:`; pull requests from forks get none.
      HAS_CORPUS: ${{ secrets.CORPUS_DEPLOY_KEY != '' && vars.CORPUS_REPOSITORY != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned PoB commits
        id: pin
        shell: bash
        run: |
          pin() { awk -v s="[$1]" '$0 == s {f=1; next} /^\[/ {f=0} f && /^commit/' pob-sync.toml | cut -d'"' -f2; }
          echo "commit=$(pin poe2)" >> "$GITHUB_OUTPUT"
          echo "commit1=$(pin poe1)" >> "$GITHUB_OUTPUT"

      # Shared with release.yml. The vendored trees are a pure function of the
      # pinned upstream commits and pob-sync, so a hit skips the clones and the
      # DDS -> WebP decode.
      - name: Cache vendored Path of Building
        id: pob
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/resources/pob
            src-tauri/resources/pob1
            src-tauri/resources/pob1-data
          key: pob-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.commit1 }}-${{ hashFiles('crates/pob-sync/**/*.rs', 'crates/pob-sync/Cargo.toml', 'pob-sync.toml', 'patches/**', 'trees/**') }}

      - name: Checkout PathOfBuilding-PoE2
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream/PathOfBuilding-PoE2

      - name: Checkout PathOfBuilding (PoE1)
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: ${{ steps.pin.outputs.commit1 }}
          path: upstream/PathOfBuilding

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # setup-bun caches the bun binary, not downloaded packages.
      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pob-forge
          cache-on-failure: true
          # Pull requests restore the cache but must not overwrite main's.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # libclang for whisper.cpp's bindings. The Windows build steps run without
      # NoDefaultCurrentDirectoryInExePath (as progression-windows.yml does); every later
      # bash step sources BASH_ENV, which unsets it. Git Bash also puts its own
      # /usr/bin/link (coreutils) ahead of MSVC's link.exe on PATH, which breaks
      # rustc and LuaJIT's msvcbuild.bat alike, so BASH_ENV puts MSVC's bin first.
      - name: Native compiler environment
        run: |
          msvc_bin="$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/x64"
          test -f "$msvc_bin/link.exe" || { echo "MSVC link.exe not found in $msvc_bin"; exit 1; }
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> "$GITHUB_ENV"
          {
            echo "unset NoDefaultCurrentDirectoryInExePath"
            echo "export PATH=\"$msvc_bin:\$PATH\""
          } > "$RUNNER_TEMP/bash_env"
          echo "BASH_ENV=$RUNNER_TEMP/bash_env" >> "$GITHUB_ENV"

      - name: MSVC's linker comes first
        run: test "$(command -v link)" -ef "$(cygpath -u "$VCToolsInstallDir")bin/Hostx64/x64/link.exe"

      - run: bun install --frozen-lockfile

      # Needs no PoB data, so it runs first and fails in seconds.
      # `check` passes --fail-on-warnings.
      - name: Type-check the frontend
        run: bun run check

      # tauri::generate_context! reads frontendDist at compile time, so the
      # bundle has to exist before anything touches the Rust side. `tauri build`
      # used to do this through beforeBuildCommand; nothing here does.
      - name: Build the frontend
        run: bun run build

      - name: Vendor Path of Building
        if: steps.pob.outputs.cache-hit != 'true'
        run: |
          cargo run --locked -p pob-sync -- --source upstream/PathOfBuilding-PoE2
          cargo run --locked -p pob-sync -- --game poe1 --source upstream/PathOfBuilding

      - name: Check every PoB stat label has a message key
        run: bun run check:labels

      # Warnings are denied via [workspace.lints.rust], so this fails on them.
      - name: Compile the workspace
        run: cargo check --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked -p pob-forge --lib && cargo test --locked -p pob-engine

      # A private corpus repository (vars.CORPUS_REPOSITORY) because it holds player names.
      # The baseline names the corpus commit it was made from, so a corpus refresh
      # changes nothing here until the baseline is accepted again.
      - name: Read the baseline's corpus commit
        id: corpus
        if: env.HAS_CORPUS == 'true'
        run: echo "commit=$(jq -r .corpus golden/poe2.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout the build corpus
        if: env.HAS_CORPUS == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CORPUS_REPOSITORY }}
          ref: ${{ steps.corpus.outputs.commit }}
          ssh-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
          persist-credentials: false
          path: corpus

      - name: Compare calculated stats with golden/poe2.json
        if: env.HAS_CORPUS == 'true'
        run: bun run golden

      # Each game's baseline names its own corpus commit, since the two games refresh separately.
      - name: Read the PoE1 baseline's corpus commit
        id: corpus1
        if: env.HAS_CORPUS == 'true'
        run: echo "commit=$(jq -r .corpus golden/poe1.json)" >> "$GITHUB_OUTPUT"

      - name: Checkout the build corpus for PoE1
        if: env.HAS_CORPUS == 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.CORPUS_REPOSITORY }}
          ref: ${{ steps.corpus1.outputs.commit }}
          ssh-key: ${{ secrets.CORPUS_DEPLOY_KEY }}
          persist-credentials: false
          path: corpus-poe1

      - name: Compare calculated stats with golden/poe1.json
        if: env.HAS_CORPUS == 'true'
        run: cargo run --locked -p pob-engine --bin pobctl -- --pob-root src-tauri/resources/pob1 golden corpus-poe1/poe1/index.json --out target/golden-poe1.json --baseline golden/poe1.json --check
