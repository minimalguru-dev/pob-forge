name: release

# Tag-driven. `bun run release:tag patch` (or `git tag vX.Y.Z && git push --tags`) builds both
# platforms, signs the updater artifacts, and creates a draft GitHub Release containing
# latest.json. Try the draft's installer, edit its notes if you like, then publish it:
# publish-cdn.yml puts it on the CDN, which is the only place installed copies look.
# With the SIGNPATH_* variables and the SIGNPATH_API_TOKEN secret set, the
# Windows program and installer are also Authenticode-signed by SignPath
# (CODE_SIGNING_POLICY.md); without them Windows builds stay unsigned.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (must already exist)"
        required: true

permissions:
  contents: write
  # SignPath fetches the unsigned build from this run's artifacts.
  actions: read

# The CDN (infra/cdn) and the pathofexile.com OAuth client are repository variables;
# a build without them leaves downloads and account sign-in off.
env:
  POB_FORGE_CDN_URL: ${{ vars.POB_FORGE_CDN_URL }}
  POB_FORGE_GGG_CLIENT_ID: ${{ vars.POB_FORGE_GGG_CLIENT_ID }}

jobs:
  # One job makes the draft, so parallel builds cannot each create their own for the same tag.
  draft:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # Release notes need the history and tags a shallow clone lacks.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Create the draft release, or reuse the one a rerun left
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -z "$id" ]; then
            notes=$(bun scripts/release-notes.mjs "$TAG")
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" -f tag_name="$TAG" -f name="PoE Forge $TAG" -f body="$notes" -F draft=true -F prerelease=false --jq .id)
          fi
          echo "id=$id" >> "$GITHUB_OUTPUT"

  release:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
          # macos-15 is an Apple Silicon runner, so this builds arm64 only --
          # the Intel half of a universal binary would need a second LuaJIT
          # build and nobody has asked for it.
          - os: macos-15
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Read pinned PoB commits
        id: pin
        shell: bash
        run: |
          pin() { awk -v s="[$1]" '$0 == s {f=1; next} /^\[/ {f=0} f && /^commit/' pob-sync.toml | cut -d'"' -f2; }
          echo "commit=$(pin poe2)" >> "$GITHUB_OUTPUT"
          echo "commit1=$(pin poe1)" >> "$GITHUB_OUTPUT"

      # Same cache as check.yml, so a tag usually reuses the vendored trees
      # that main already produced for these pinned commits.
      - name: Cache vendored Path of Building
        id: pob
        uses: actions/cache@v6
        with:
          path: |
            src-tauri/resources/pob
            src-tauri/resources/pob1
            src-tauri/resources/pob1-data
          key: pob-${{ runner.os }}-${{ steps.pin.outputs.commit }}-${{ steps.pin.outputs.commit1 }}-${{ hashFiles('crates/pob-sync/**/*.rs', 'crates/pob-sync/Cargo.toml', 'pob-sync.toml', 'patches/**', 'trees/**') }}

      - name: Checkout PathOfBuilding-PoE2
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding-PoE2
          ref: ${{ steps.pin.outputs.commit }}
          path: upstream/PathOfBuilding-PoE2

      - name: Checkout PathOfBuilding (PoE1)
        if: steps.pob.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: PathOfBuildingCommunity/PathOfBuilding
          ref: ${{ steps.pin.outputs.commit1 }}
          path: upstream/PathOfBuilding

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # setup-bun caches the bun binary, not downloaded packages.
      - name: Cache bun packages
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-${{ runner.arch }}-
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: pob-forge-${{ runner.arch }}
          cache-on-failure: true

      - run: bun install --frozen-lockfile

      - name: Vendor Path of Building
        if: steps.pob.outputs.cache-hit != 'true'
        run: |
          cargo run -p pob-sync -- --source upstream/PathOfBuilding-PoE2
          cargo run -p pob-sync -- --game poe1 --source upstream/PathOfBuilding

      - name: Check the downloadable files are on the CDN
        run: bun scripts/downloads.ts check

      # The updater's public key and the CDN mirror of latest.json are repository
      # variables, so the checked-in config never trusts a key it does not own.
      - name: Configure the updater
        shell: bash
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -z "$PUBKEY" ]; then
            echo "::error::Set the TAURI_UPDATER_PUBKEY repository variable (bun tauri signer generate) before releasing."
            exit 1
          fi
          bun -e '
            const path = "src-tauri/tauri.conf.json";
            const conf = await Bun.file(path).json();
            conf.plugins.updater.pubkey = process.env.PUBKEY;
            // Installed copies read updates from the CDN (publish-cdn.yml uploads them); its Worker
            // falls back to the latest GitHub release while the bucket has none. This script sits in
            // single quotes in bash: no apostrophes in it.
            const cdn = (process.env.POB_FORGE_CDN_URL ?? "").replace(/\/+$/, "");
            conf.plugins.updater.endpoints = [
              cdn ? `${cdn}/update/latest.json` : `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/latest/download/latest.json`,
            ];
            await Bun.write(path, JSON.stringify(conf, null, 2) + "\n");
          '

      # Builds, signs the updater artifacts with the minisign key and uploads them with latest.json to the draft.
      # Windows takes the SignPath steps below instead once the SignPath variables are set.
      - uses: tauri-apps/tauri-action@v1
        if: runner.os != 'Windows' || vars.SIGNPATH_ORGANIZATION_ID == ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_UPDATER: "true"
        with:
          releaseId: ${{ needs.draft.outputs.id }}
          uploadUpdaterJson: true
          args: --bundles ${{ matrix.bundles }}

      # Windows, signed by SignPath (CODE_SIGNING_POLICY.md): the program is built and signed first,
      # then bundled into the installer, which is signed too. Each signing request waits for a
      # team member to approve it in SignPath. The updater signature is made last, over the signed
      # installer, since Authenticode signing changes the file.
      - name: Read the version
        id: version
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: echo "version=$(bun -e 'console.log((await Bun.file("src-tauri/tauri.conf.json").json()).version)')" >> "$GITHUB_OUTPUT"

      # Bundling writes the bundle type into the program, which would break a signature made
      # before it; a second bundle leaves an already-written program as it is. So: build, bundle
      # once, sign that program, bundle again around the signed one.
      - name: Build the program
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          VITE_UPDATER: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          bun tauri build --no-bundle
          bun tauri bundle --bundles nsis

      - name: Upload the unsigned program
        id: unsigned-app
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-program
          path: target/release/pob-forge.exe
          if-no-files-found: error

      - name: Sign the program (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # Room for the approver to open SignPath and approve.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/program
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Bundle the installer around the signed program
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cp signed/program/pob-forge.exe target/release/pob-forge.exe
          bun tauri bundle --bundles nsis

      - name: Upload the unsigned installer
        id: unsigned-installer
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

      - name: Sign the installer (SignPath)
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed/installer
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      # target/release/pob-forge.exe is the program the second bundle packed into the installer.
      - name: Check both signatures
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $files = @("target/release/pob-forge.exe") + (Get-ChildItem signed/installer/*-setup.exe | ForEach-Object FullName)
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$f is not validly signed" }
          }

      # GitHub turns spaces in asset names into dots; naming the files so keeps the installer and
      # its .sig matched for scripts/updater-manifest.mjs.
      - name: Sign the installer for the updater and upload it to the draft
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          src=$(ls signed/installer/*-setup.exe | head -n 1)
          name=$(basename "$src" | tr ' ' '.')
          cp "$src" "$name"
          bun tauri signer sign "$name"
          gh release upload "$TAG" "$name" "$name.sig" -R "$GITHUB_REPOSITORY" --clobber

      # A bundle whose resources are not sealed opens as "damaged" once downloaded.
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict -vv "target/release/bundle/macos/PoE Forge.app"

  # Matrix jobs each rewrite latest.json and can drop a platform when two finish together.
  updater-manifest:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          sparse-checkout: scripts
      - name: Rebuild latest.json from the uploaded signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/updater-manifest.mjs "$TAG" "$GITHUB_REPOSITORY"
